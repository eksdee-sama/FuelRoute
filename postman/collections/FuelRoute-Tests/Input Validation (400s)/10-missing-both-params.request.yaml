$kind: http-request
name: Missing Both Params
method: GET
url: '{{baseUrl}}/api/route/'
order: 10000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 400', function () {
        pm.response.to.have.status(400);
      });
      pm.test('Response has error key', function () {
        var j = pm.response.json();
        pm.expect(j).to.have.property('error');
      });
