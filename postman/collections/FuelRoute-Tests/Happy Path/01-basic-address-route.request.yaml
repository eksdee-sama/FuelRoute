$kind: http-request
name: Basic address route
method: GET
url: '{{baseUrl}}/api/route/'
order: 1000
queryParams:
  - key: start
    value: 'New York,NY'
  - key: end
    value: 'Boston,MA'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const jsonData = pm.response.json();

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response time is less than 5000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });

      pm.test("Response has required top-level keys", function () {
          pm.expect(jsonData).to.have.property("route");
          pm.expect(jsonData).to.have.property("fuel_stops");
          pm.expect(jsonData).to.have.property("summary");
          pm.expect(jsonData).to.have.property("all_route_stations");
      });

      pm.test("route.total_distance_miles is a positive number", function () {
          pm.expect(jsonData.route.total_distance_miles).to.be.a("number");
          pm.expect(jsonData.route.total_distance_miles).to.be.above(0);
      });

      pm.test("summary.total_fuel_cost_usd is a positive number", function () {
          pm.expect(jsonData.summary.total_fuel_cost_usd).to.be.a("number");
          pm.expect(jsonData.summary.total_fuel_cost_usd).to.be.above(0);
      });

      pm.test("summary.vehicle_specs has tank_range_miles and fuel_efficiency_mpg", function () {
          pm.expect(jsonData.summary.vehicle_specs).to.have.property("tank_range_miles");
          pm.expect(jsonData.summary.vehicle_specs).to.have.property("fuel_efficiency_mpg");
      });

      pm.test("X-Cache header exists and is HIT or MISS", function () {
          pm.expect(pm.response.headers.get("X-Cache")).to.be.oneOf(["HIT", "MISS"]);
      });

      pm.test("X-Response-Time header exists", function () {
          pm.expect(pm.response.headers.get("X-Response-Time")).to.exist;
      });

      pm.test("Security header X-Content-Type-Options is nosniff", function () {
          pm.expect(pm.response.headers.get("X-Content-Type-Options")).to.equal("nosniff");
      });

      pm.test("Security header X-Frame-Options is DENY", function () {
          pm.expect(pm.response.headers.get("X-Frame-Options")).to.equal("DENY");
      });

      pm.test("fuel_stops is an array; if non-empty each stop has required fields", function () {
          pm.expect(Array.isArray(jsonData.fuel_stops)).to.be.true;
          if (jsonData.fuel_stops.length > 0) {
              jsonData.fuel_stops.forEach(function (stop) {
                  pm.expect(stop).to.have.property("stop_number");
                  pm.expect(stop).to.have.property("price_per_gallon");
                  pm.expect(stop).to.have.property("gallons_to_add");
                  pm.expect(stop).to.have.property("cost_usd");
              });
          }
      });

      pm.collectionVariables.set("lastTotalCost", jsonData.summary.total_fuel_cost_usd);
