$kind: http-request
name: Cache HIT test
method: GET
url: '{{baseUrl}}/api/route/'
order: 3000
queryParams:
  - key: start
    value: 'New York,NY'
  - key: end
    value: 'Boston,MA'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.collectionVariables.set("cacheTestStart", Date.now());
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("X-Cache header equals HIT", function () {
          pm.expect(pm.response.headers.get("X-Cache")).to.equal("HIT");
      });

      pm.test("Response time is less than 1000ms (cache hit should be fast)", function () {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
